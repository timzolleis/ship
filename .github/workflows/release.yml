name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2.9.1

      # SHIP_VERSION pins the embedded version to the release tag below —
      # `ship update` compares them for equality, so they must match exactly.
      - name: Build darwin binaries
        env:
          SHIP_VERSION: ${{ steps.sha.outputs.short }}
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/ship ship-darwin-arm64
          cp target/x86_64-apple-darwin/release/ship ship-darwin-x64
          codesign --sign - --force ship-darwin-arm64
          codesign --sign - --force ship-darwin-x64

      - name: Smoke test
        run: |
          ./ship-darwin-arm64 --version | grep -F "${{ steps.sha.outputs.short }}"

      - name: Create release ${{ steps.sha.outputs.short }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          target_commitish: ${{ github.sha }}
          files: ship-darwin-*
          fail_on_unmatched_files: true
